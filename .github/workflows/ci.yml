name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Build with the real Firebase configuration
        type: boolean
        default: false
    secrets:
      GOOGLE_SERVICES_JSON:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'
  JAVA_VERSION: '17'

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --coverage
      - name: Save coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

  dependencies:
    name: Dependency vulnerabilities
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: --lockfile=pubspec.lock
      upload-sarif: false
      fail-on-vuln: true
      runs-on: ubuntu-24.04

  security:
    name: Dart code security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.168.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan Dart code
        run: semgrep scan --config .github/security/dart-tls.yml --strict --error --metrics=off --disable-version-check --json --output semgrep.json lib
      - name: Save security report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 14
          if-no-files-found: warn

  # Add an independent macOS/iOS build job here when iOS enters the pipeline.
  android:
    name: Android APK
    needs: [quality, dependencies, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Configure validation Firebase
        if: ${{ !inputs.release }}
        run: cp .github/firebase/google-services.example.json android/app/google-services.json
      - name: Configure release Firebase
        if: ${{ inputs.release }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -z "$GOOGLE_SERVICES_JSON" ]]; then
            echo '::error::GOOGLE_SERVICES_JSON is required for releases.'
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build apk --release --build-number="$BUILD_NUMBER"
      - name: Save APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

rules:
  - id: dart-accept-all-certificates
    languages: [generic]
    severity: ERROR
    message: Do not accept every invalid TLS certificate; use normal certificate validation.
    # A focused textual rule: unconditional arrow and block callbacks only.
    pattern-regex: 'badCertificateCallback\s*=\s*\([^)]*\)\s*(?:=>\s*true\b|\{\s*return\s+true\s*;)'
    paths:
      include: ['**/*.dart']
